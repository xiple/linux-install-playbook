---
- name: Configure linux desktop host (root)
  hosts: all
  become: true
  vars_files:
    - vars.yml

  pre_tasks:
    - name: Ensure git is installed.
      ansible.builtin.package:
        name: git
        state: present
      tags:
        - dotfiles

  roles:
    - role: xiple.rpmfusion
      tags:
        - rpmfusion

    - role: xiple.vscode
      tags:
        - vscode

    - role: xiple.tailscale
      tags:
        - tailscale

    - role: xiple.tlp
      tags:
        - tlp

    - role: xiple.veracrypt
      tags:
        - veracrypt

    - role: xiple.dotfiles
      tags:
        - dotfiles

    - role: geerlingguy.docker
      tags:
        - docker

  tasks:
    - name: Import storage tasks
      ansible.builtin.import_tasks: tasks/storage.yml
      tags:
        - storage

    - name: Import main tasks
      ansible.builtin.import_tasks: tasks/main.yml
      tags:
        - main

    - name: Import Gnome tasks
      ansible.builtin.import_tasks: tasks/gnome.yml
      become: false
      tags:
        - gnome

    - name: Import privacy tasks
      ansible.builtin.import_tasks: tasks/privacy.yml
      tags:
        - privacy

    - name: Import virtualization tasks
      ansible.builtin.import_tasks: tasks/virtualization.yml
      tags:
        - virt

  handlers:
    - name: Restart NetworkManager
      ansible.builtin.systemd:
        name: NetworkManager
        state: restarted

- name: Configure linux desktop host (no root)
  hosts: all
  become: false
  vars_files:
    - vars.yml

  roles:
    - role: xiple.dotfiles
      tags:
        - dotfiles
