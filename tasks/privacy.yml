---
# Make sure telemetry (dnf) is off
- name: Install custom dnf.conf to disable telemetry
  ansible.builtin.copy:
    src: dnf.conf
    dest: "{{ dnf_conf_path }}"
    mode: '0644'

- name: Install custom NetworkManager drop-in for mac randomization
  ansible.builtin.copy:
    src: 00-macrandomize.conf
    dest: "{{ networkmanager_mac_random_dropin_path }}"
    mode: '0644'
  notify: Restart NetworkManager