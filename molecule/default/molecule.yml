---
# do not automatically install roles from project level 'requirements.yml'
# prevent conflicts between updated roles and created copies in ~/.ansible/roles
prerun: false

ansible:
  cfg:
    defaults:
      deprecation_warnings: false
  executor:
    args:
      ansible_playbook:
        - --inventory=inventory/
        - --extra-vars=networkmanager_service_manage=false

dependency:
  name: galaxy
  options:
    requirements-file: ${MOLECULE_SCENARIO_DIRECTORY}/requirements.yml

scenario:
  test_sequence:
    - dependency
    - destroy
    - create
    - converge
    - idempotence
    - verify
    - destroy
